<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="polyDisplay">
<title>polyDisplay</title>
<!--
  polyDisplay - kiosk dashboard for an old iPad (iOS 10.3.3)
  The iPad talks ONLY to the local Go server (/api/*): it aggregates
  Polymarket positions + crypto prices/candles (Binance-first, CoinGecko
  fallback) so the iPad never hits an external API, rate limit, or geoblock.
  Left : Polymarket positions   Right: token watchlist + 7d candlesticks
-->
<style>
  :root{--bg:#0b0e13;--panel:#141922;--panel2:#1b2230;--line:#232c3b;--text:#e6ecf5;
        --muted:#8a97a8;--green:#34d399;--red:#f77;--accent:#5b8cff;
        --buy:#7aa2ff;--yes:#a78bfa;--no:#4fc3d9;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;}
  header .brand{font-size:20px;font-weight:700;letter-spacing:.5px;}
  header .brand span{color:var(--accent);}
  header .right{display:flex;align-items:center;}
  header .status{font-size:13px;color:var(--muted);text-align:right;line-height:1.4;margin-right:14px;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);
    margin-left:6px;vertical-align:middle;}
  .dot.ok{background:var(--green);} .dot.err{background:var(--red);}
  .gear{font-size:22px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 6px;}
  main{display:flex;flex:1 1 auto;min-height:0;}
  .col{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;}
  .col.left{border-right:1px solid var(--line);}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;flex:0 0 auto;}
  .col-head h2{margin:0;font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .col-head .sub{font-size:15px;font-weight:700;text-align:right;}
  .list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 12px;}

  .pos{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 4px;}
  .pos .title{font-size:15px;font-weight:600;line-height:1.25;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pos .row{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .pos .meta{color:var(--muted);}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:8px;}
  .badge.yes{background:rgba(167,139,250,.16);color:var(--yes);}
  .badge.no{background:rgba(79,195,217,.16);color:var(--no);}
  .price-move{font-variant-numeric:tabular-nums;}

  .coin{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 4px;}
  .coin.active{box-shadow:inset 3px 0 0 var(--accent);}
  .coin .top{display:flex;align-items:baseline;justify-content:space-between;}
  .coin .sym{font-size:18px;font-weight:700;}
  .coin .name{font-size:12px;color:var(--muted);margin-left:8px;}
  .coin .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .coin .chg{font-size:13px;font-weight:600;margin-left:8px;}
  .chart{width:100%;display:block;}
  .chartwrap{position:relative;margin-top:8px;}
  .yhi,.ylo{position:absolute;font-size:9px;color:var(--muted);white-space:nowrap;
    font-family:"SF Mono",Menlo,Monaco,monospace;background:rgba(11,14,19,.55);
    padding:0 3px;border-radius:3px;pointer-events:none;transform:translateX(-50%);}
  .ylast{position:absolute;left:3px;font-size:9px;color:var(--accent);background:rgba(11,14,19,.65);
    padding:0 3px;border-radius:3px;pointer-events:none;font-family:"SF Mono",Menlo,Monaco,monospace;}
  .xaxis{display:flex;justify-content:space-between;font-family:"SF Mono",Menlo,Monaco,monospace;
    font-size:9px;color:var(--muted);padding:2px 1px 0;}
  .trendrow{display:flex;align-items:center;margin-top:6px;padding:0 1px;}
  .trend{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 6px;
    border-radius:5px;text-transform:uppercase;}
  .trend.up{background:rgba(52,211,153,.16);color:var(--green);}
  .trend.down{background:rgba(255,119,119,.16);color:var(--red);}
  .trend.flat{background:rgba(138,151,168,.14);color:var(--muted);}
  .trendrow .why{margin-left:8px;font-size:9px;color:var(--muted);
    font-family:"SF Mono",Menlo,Monaco,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .srctag{font-size:11px;color:var(--muted);float:right;}
  .log-head{margin:16px 4px 8px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .log{font-family:"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:12px;line-height:1.6;padding:0 4px;}
  .logrow{white-space:pre;overflow:hidden;text-overflow:ellipsis;}
  .logrow .lt{color:var(--muted);}
  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--muted);}
  .buy{color:var(--buy);} .sell{color:var(--green);}
  .win{color:var(--green);font-weight:600;} .loss{color:var(--red);font-weight:600;}
  .empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:15px;}
  .err-banner{display:none;background:rgba(255,119,119,.12);color:var(--red);font-size:13px;
    padding:6px 16px;border-bottom:1px solid var(--line);}
  .err-banner.show{display:block;}
  footer{flex:0 0 auto;padding:6px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);
    display:flex;justify-content:space-between;}

  .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:10;}
  .modal.show{display:flex;align-items:center;justify-content:center;}
  .sheet{background:var(--panel2);border:1px solid var(--line);border-radius:14px;width:520px;max-width:92%;
    max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px;}
  .sheet h3{margin:0 0 12px;font-size:18px;}
  .sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px;}
  .sheet input,.sheet select{width:100%;padding:10px 12px;font-size:15px;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:8px;-webkit-appearance:none;}
  .chip{display:flex;align-items:center;justify-content:space-between;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px;}
  .chip .x{color:var(--red);font-weight:700;cursor:pointer;padding:0 6px;font-size:18px;}
  .result{padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;}
  .result:active{background:var(--bg);}
  .btnrow{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
    color:var(--text);font-size:15px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .muted{color:var(--muted);font-size:12px;}
  #pullHint{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;z-index:20;
    display:flex;align-items:center;justify-content:center;background:var(--panel2);
    color:var(--muted);font-size:14px;font-weight:600;opacity:0;transition:opacity .12s;}
</style>
</head>
<body>
<div id="pullHint">&#8595; pull to reload</div>
<div id="app">
  <header>
    <div class="brand">poly<span>Display</span></div>
    <div class="right">
      <div class="status">
        <div id="clock">--:--:--</div>
        <div>Server <span id="srvDot" class="dot"></span></div>
      </div>
      <button class="gear" id="gearBtn" title="Settings">&#9881;</button>
    </div>
  </header>
  <div id="errBanner" class="err-banner"></div>
  <main>
    <div class="col left">
      <div class="col-head"><h2>Polymarket</h2><div class="sub" id="pmSummary">&mdash;</div></div>
      <div class="list" id="pmList"><div class="empty">Connecting to server&hellip;</div></div>
    </div>
    <div class="col right">
      <div class="col-head"><h2 id="cxTitle">Watchlist</h2><div class="sub" id="cxUpdated">&mdash;</div></div>
      <div class="list" id="cxList"><div class="empty">Connecting to server&hellip;</div></div>
    </div>
  </main>
  <footer><span id="footL">polyDisplay &middot; pull down to reload</span><span id="appVer">v13 &middot; server</span></footer>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>Settings</h3>
    <label>Polymarket wallet</label>
    <input id="walletInput" type="text" spellcheck="false" autocapitalize="off" placeholder="0x...">
    <label>Candle range</label>
    <select id="daysSel">
      <option value="1">1 day</option><option value="7">7 days</option>
      <option value="14">14 days</option><option value="30">30 days</option>
    </select>
    <label>Sort watchlist</label>
    <select id="sortSel">
      <option value="trades">Traded assets first</option>
      <option value="az">Symbol A&ndash;Z</option>
      <option value="config">As added (custom order)</option>
    </select>
    <label>Watchlist assets</label>
    <div id="chips"></div>
    <label>Add asset (search)</label>
    <input id="searchInput" type="text" spellcheck="false" autocapitalize="off" placeholder="e.g. bitcoin, sol, chainlink">
    <div id="results"></div>
    <div class="btnrow">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save &amp; reload</button>
    </div>
    <button class="btn" id="reloadBtn" style="width:100%;margin-top:10px">Reload app &middot; clear cache</button>
    <div class="muted" style="margin-top:10px">Saved on the server (config.json). Data source: Binance &rarr; CoinGecko fallback.</div>
  </div>
</div>

<script>
/* the page is served BY the Go server, so the API is same-origin */
var API = "";                 // e.g. set to "http://192.168.4.201:8080" to point elsewhere
var POLL = 10000;             // how often the iPad asks the server for fresh state

function $(id){ return document.getElementById(id); }
function p2(x){ return (x<10?"0":"")+x; }
function fmtUsd(n){ if(n==null||isNaN(n))return "-"; var a=Math.abs(n),dp=a>=1000?0:a>=1?2:a>=0.01?4:6;
  return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtSignedUsd(n){ if(n==null||isNaN(n))return "-"; return (n>=0?"+":"-")+fmtUsd(Math.abs(n)); }
function fmtPct(n){ if(n==null||isNaN(n))return ""; return (n>=0?"+":"")+Number(n).toFixed(2)+"%"; }
function cls(n){ return n>0?"up":n<0?"down":"flat"; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function setDot(id,ok){ $(id).className="dot "+(ok?"ok":"err"); }
function showErr(msg){ var b=$("errBanner"); if(msg){ b.textContent=msg; b.className="err-banner show"; } else { b.className="err-banner"; } }

function tick(){ var d=new Date(); $("clock").textContent=p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds()); }
setInterval(tick,1000); tick();

/* shared geometry for a candle series plus the live spot overlay */
function chartMetrics(data,spot){
  var lo=Infinity,hi=-Infinity,iHi=0,iLo=0;
  for(var i=0;i<data.length;i++){
    if(data[i][2]>hi){ hi=data[i][2]; iHi=i; }
    if(data[i][3]<lo){ lo=data[i][3]; iLo=i; }
  }
  var last=data[data.length-1][4];
  /* spot refreshes faster than candles; last close is the fallback */
  var sp=(spot!=null && isFinite(spot) && spot>0) ? +spot : last;
  /* plot range covers spot so a breakout past the window stays on canvas */
  var pLo=Math.min(lo,sp), pHi=Math.max(hi,sp);
  return {lo:lo,hi:hi,iHi:iHi,iLo:iLo,spot:sp,n:data.length,
          plotLo:pLo,plotRange:(pHi-pLo)||1};
}
function chartY(m,v,h){ return h-2-((v-m.plotLo)/m.plotRange)*(h-4); }
function chartX(m,i,w){ var cw=w/m.n; return i*cw+cw/2; }

/* ---------- market structure (higher highs / lower lows) ---------- */

/* a high or low must move this many typical candle ranges to score a step.
   Measured against candle size rather than window range: a trend inflates
   its own window range, which would raise the bar the stronger it gets. */
var TREND_DEADBAND_ATR=3.5;

function segExtremes(data,from,to){
  var hi=-Infinity,lo=Infinity;
  for(var i=from;i<to;i++){ if(data[i][2]>hi)hi=data[i][2]; if(data[i][3]<lo)lo=data[i][3]; }
  return {hi:hi,lo:lo};
}
function stepSign(a,b,dead){ return b>a+dead ? 1 : (b<a-dead ? -1 : 0); }
function medianCandleRange(data){
  var r=[];
  for(var i=0;i<data.length;i++) r.push(data[i][2]-data[i][3]);
  r.sort(function(a,b){ return a-b; });
  var m=r.length>>1;
  return r.length%2 ? r[m] : (r[m-1]+r[m])/2;
}

/* Scores the window in thirds. Each side is graded on both adjacent steps
   plus the first-to-last span, so a window that trends then flattens still
   reads directionally while a round trip cancels out to zero. A side that
   scores zero is undecided, not opposed, so it does not veto the other. */
function trendVerdict(data){
  if(!data||data.length<9) return null;
  var n=data.length, a=Math.floor(n/3), b=Math.floor(2*n/3);
  var s1=segExtremes(data,0,a), s2=segExtremes(data,a,b), s3=segExtremes(data,b,n);
  var dead=medianCandleRange(data)*TREND_DEADBAND_ATR;
  var H=stepSign(s1.hi,s2.hi,dead)+stepSign(s2.hi,s3.hi,dead)+stepSign(s1.hi,s3.hi,dead);
  var L=stepSign(s1.lo,s2.lo,dead)+stepSign(s2.lo,s3.lo,dead)+stepSign(s1.lo,s3.lo,dead);
  if(H>0&&L<0) return {label:"Expanding",cls:"flat",why:"higher highs · lower lows"};
  if(H<0&&L>0) return {label:"Coiling",  cls:"flat",why:"lower highs · higher lows"};
  if(H>0||L>0)  return {label:"Uptrend",  cls:"up",  why:whyTrend(H,L,"higher")};
  if(H<0||L<0)  return {label:"Downtrend",cls:"down",why:whyTrend(H,L,"lower")};
  return {label:"Neutral",cls:"flat",why:"no clear structure"};
}
function whyTrend(H,L,dir){
  if(H&&L) return dir+" highs · "+dir+" lows";
  return H ? dir+" highs · flat lows" : "flat highs · "+dir+" lows";
}

/* swing high: high beats the k candles either side. Ties are strict on the
   left and permissive on the right, so a flat top keeps its first candle. */
function swingPivots(data,k){
  var n=data.length, hs=[], ls=[];
  for(var i=k;i<n-k;i++){
    var isH=true,isL=true,j;
    for(j=i-k;j<i;j++){
      if(data[j][2]>=data[i][2]) isH=false;
      if(data[j][3]<=data[i][3]) isL=false;
    }
    for(j=i+1;j<=i+k;j++){
      if(data[j][2]>data[i][2]) isH=false;
      if(data[j][3]<data[i][3]) isL=false;
    }
    if(isH) hs.push(i);
    if(isL) ls.push(i);
  }
  return {highs:hs,lows:ls};
}
function pivotK(n){ return Math.max(2,Math.round(n/20)); }

/* candlestick chart (tokens only) */
function candleChart(data,w,h,m){
  var n=m.n, cw=w/n, bw=Math.max(1.2,cw*0.62);
  function Y(v){ return chartY(m,v,h); }
  var s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" height="'+h+'" preserveAspectRatio="none">';
  for(var j=0;j<n;j++){
    var o=data[j][1],high=data[j][2],low=data[j][3],c=data[j][4];
    var x=j*cw+cw/2, up=c>=o, col=up?"#34d399":"#f77";
    s+='<line x1="'+x.toFixed(1)+'" y1="'+Y(high).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+Y(low).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    var yo=Y(o),yc=Y(c),top=Math.min(yo,yc),bh=Math.max(1,Math.abs(yo-yc));
    s+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+col+'"/>';
  }
  var pv=swingPivots(data,pivotK(n)), dr=Math.max(1,cw*0.3);
  for(var q=0;q<pv.highs.length;q++) s+=pivotDot(chartX(m,pv.highs[q],w),Y(data[pv.highs[q]][2])-2,dr);
  for(var r=0;r<pv.lows.length;r++)  s+=pivotDot(chartX(m,pv.lows[r],w), Y(data[pv.lows[r]][3])+2,dr);
  s+=channelLine(m,pv.highs,function(i){return data[i][2];},w,h,"#8a97a8");
  s+=channelLine(m,pv.lows, function(i){return data[i][3];},w,h,"#8a97a8");
  /* ticks on the candles that made the window high and low */
  var tw=Math.max(5,cw*1.6);
  s+=extremeTick(chartX(m,m.iHi,w),Y(m.hi),tw);
  s+=extremeTick(chartX(m,m.iLo,w),Y(m.lo),tw);
  var yl=Y(m.spot);
  s+='<line x1="0" y1="'+yl.toFixed(1)+'" x2="'+w+'" y2="'+yl.toFixed(1)+'" stroke="#5b8cff" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.8"/>';
  return s+'</svg>';
}
/* rect, not circle - preserveAspectRatio="none" would stretch it to an ellipse */
function pivotDot(x,y,rx){
  return '<rect x="'+(x-rx).toFixed(1)+'" y="'+(y-1).toFixed(1)+'" width="'+(rx*2).toFixed(1)+
         '" height="2" fill="#8a97a8" opacity="0.45"/>';
}
/* least-squares line through every pivot on one side, so it spans the whole
   period instead of hanging off the last two swings, clipped to the plot */
function channelLine(m,idx,valAt,w,h,col){
  if(idx.length<2) return "";
  var k=idx.length, sx=0, sy=0, sxx=0, sxy=0;
  for(var q=0;q<k;q++){
    var x=chartX(m,idx[q],w), y=chartY(m,valAt(idx[q]),h);
    sx+=x; sy+=y; sxx+=x*x; sxy+=x*y;
  }
  var den=k*sxx-sx*sx;
  if(den===0) return "";
  var sl=(k*sxy-sx*sy)/den, ic=(sy-sl*sx)/k, ax=0, bx=w;
  if(sl!==0){
    var xTop=-ic/sl, xBot=(h-ic)/sl;
    ax=Math.max(ax,Math.min(xTop,xBot));
    bx=Math.min(bx,Math.max(xTop,xBot));
  } else if(ic<0||ic>h) return "";
  if(bx-ax<1) return "";
  return '<line x1="'+ax.toFixed(1)+'" y1="'+(sl*ax+ic).toFixed(1)+'" x2="'+bx.toFixed(1)+
         '" y2="'+(sl*bx+ic).toFixed(1)+'" stroke="'+col+
         '" stroke-width="0.9" stroke-dasharray="3,3" opacity="0.5"/>';
}
function extremeTick(x,y,tw){
  return '<line x1="'+(x-tw/2).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+(x+tw/2).toFixed(1)+
         '" y2="'+y.toFixed(1)+'" stroke="#8a97a8" stroke-width="1" opacity="0.85"/>';
}

function padR(s,n){ s=String(s); while(s.length<n) s+=" "; return s; }
function padL(s,n){ s=String(s); while(s.length<n) s=" "+s; return s; }
function trimNum(n){ n=+n; return (n===Math.floor(n))?String(n):n.toFixed(2); }
function activityHtml(acts){
  var lg='<div class="log-head">Recent activity</div>';
  if(!acts.length) return lg+'<div class="log"><div class="lt">no recent activity</div></div>';
  lg+='<div class="log">';
  for(var i=0;i<acts.length;i++){
    var a=acts[i], dt=new Date(a.t*1000);
    var tm=p2(dt.getHours())+":"+p2(dt.getMinutes())+":"+p2(dt.getSeconds());
    var lbl=(a.side||a.type||"").toUpperCase();
    var lc="flat";
    if(lbl==="BUY") lc="buy";
    else if(lbl==="SELL") lc="sell";
    else if(a.type==="REDEEM") lc=(+a.usdc>0)?"win":"loss";
    var detail=(a.type==="TRADE")
      ? (padL(trimNum(a.size),3)+" @ "+(+a.price).toFixed(3))
      : ("$"+(+a.usdc).toFixed(2));
    var oc=a.outcome?("["+esc(a.outcome)+"] "):"";
    lg+='<div class="logrow"><span class="lt">'+tm+'</span>   '+
        '<span class="'+lc+'">'+padR(lbl,6)+'</span> '+
        padR(detail,13)+'  '+oc+esc(a.title)+'</div>';
  }
  return lg+'</div>';
}

/* candlestick chart wrapped with time (x) + price (y) axes */
function axisTime(ms,days){
  var d=new Date(ms);
  if(days<=1) return p2(d.getHours())+":"+p2(d.getMinutes());
  return (d.getMonth()+1)+"/"+d.getDate();
}
/* keep a label anchored to its candle without letting it run off either edge */
function labelLeft(m,i,w){ return Math.max(8,Math.min(92,(chartX(m,i,w)/w)*100)); }

function chartWithAxis(data,w,h,days,spot,trendData){
  if(!data||data.length<2) return '<svg class="chart" height="'+h+'"></svg>';
  var m=chartMetrics(data,spot), labels="";
  var n=m.n; days=days||7;
  for(var f=0;f<=3;f++){ var idx=Math.round((n-1)*f/3); labels+='<span>'+axisTime(data[idx][0],days)+'</span>'; }
  var spotTop=Math.max(0,Math.min(h-11,chartY(m,m.spot,h)-6));
  var hiTop=Math.max(0,chartY(m,m.hi,h)-11);
  var loTop=Math.min(h-11,chartY(m,m.lo,h)+2);
  /* the chip reads 24h; the drawn pattern stays on the displayed period */
  var tr=trendVerdict(trendData&&trendData.length>=9 ? trendData : data);
  var trWin=(trendData&&trendData.length>=9) ? "24h" : days+"d";
  var trHtml=tr?('<div class="trendrow"><span class="trend '+tr.cls+'">'+tr.label+'</span>'+
                 '<span class="why">'+esc(tr.why)+' &middot; '+trWin+'</span></div>'):"";
  return '<div class="chartwrap">'+
    '<div class="yhi" style="top:'+hiTop.toFixed(0)+'px;left:'+labelLeft(m,m.iHi,w).toFixed(1)+'%">&#9650; '+fmtUsd(m.hi)+'</div>'+
    '<div class="ylo" style="top:'+loTop.toFixed(0)+'px;left:'+labelLeft(m,m.iLo,w).toFixed(1)+'%">&#9660; '+fmtUsd(m.lo)+'</div>'+
    '<div class="ylast" style="top:'+spotTop.toFixed(0)+'px">'+fmtUsd(m.spot)+'</div>'+
    candleChart(data,w,h,m)+
    '<div class="xaxis">'+labels+'</div>'+trHtml+
    '</div>';
}

/* ---------- poll the server ---------- */
function loadState(){
  fetch(API+"/api/state",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(s){ setDot("srvDot",true); showErr(s.note||""); render(s); })
    .catch(function(e){ setDot("srvDot",false); showErr("Server unreachable: "+e.message); })
    .then(function(){ setTimeout(loadState, POLL); });
}

function render(s){
  var rows=s.positions||[], html="";
  if(!rows.length){ html='<div class="empty">No open positions.</div>'; $("pmSummary").innerHTML="&mdash;"; }
  else {
    var totalVal=0,totalPnl=0;
    for(var i=0;i<rows.length;i++){
      var p=rows[i]; totalVal+=(+p.currentValue||0); totalPnl+=(+p.cashPnl||0);
      var isYes=(p.outcome||"").toLowerCase()==="yes";
      html+='<div class="pos"><div class="title">'+esc(p.title)+'</div>'+
        '<div class="row"><span class="meta">'+
          '<span class="badge '+(isYes?"yes":"no")+'">'+esc(p.outcome)+'</span>'+
          esc((+p.size).toFixed(1))+' @ <span class="price-move">'+
          (p.avgPrice!=null?(+p.avgPrice).toFixed(3):"-")+' &rarr; '+(p.curPrice!=null?(+p.curPrice).toFixed(3):"-")+'</span></span>'+
          '<span class="'+cls(+p.cashPnl)+'">'+fmtSignedUsd(+p.cashPnl)+' <span style="opacity:.75">('+fmtPct(+p.percentPnl)+')</span></span>'+
        '</div>'+
        '<div class="row" style="margin-top:4px"><span class="meta">value</span><span>'+fmtUsd(+p.currentValue)+'</span></div></div>';
    }
    $("pmSummary").innerHTML=fmtUsd(totalVal)+' <span class="'+cls(totalPnl)+'">'+fmtSignedUsd(totalPnl)+'</span>';
  }
  html += activityHtml(s.activity||[]);
  $("pmList").innerHTML=html;

  var coins=s.coins||[], cl="";
  if(!coins.length){ cl='<div class="empty">No assets. Tap &#9881; to add.</div>'; }
  for(var k=0;k<coins.length;k++){
    var c=coins[k];
    var tag=c.source?('<span class="srctag">'+(c.source==="binance"?"Binance":"CoinGecko")+'</span>'):"";
    cl+='<div class="coin'+(c.active?' active':'')+'"><div class="top">'+
      '<div><span class="sym">'+esc(c.sym)+'</span><span class="name">'+esc(c.name)+'</span></div>'+
      '<div><span class="val">'+fmtUsd(c.price)+'</span>'+
        '<span class="chg '+cls(c.chg24h)+'">'+(c.chg24h!=null?fmtPct(c.chg24h)+" 24h":"")+'</span></div></div>'+
      chartWithAxis(c.candles,320,72,s.candleDays,c.price,c.cand24)+tag+'</div>';
  }
  $("cxList").innerHTML=cl;

  if(s.candleDays) $("cxTitle").innerHTML="Watchlist &middot; "+s.candleDays+"d";
  var d=s.updated?new Date(s.updated*1000):new Date();
  $("cxUpdated").textContent="upd "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());
}

/* ---------- settings (server config) ---------- */
var draftCoins=null, draftCfg=null;
function openSettings(){
  fetch(API+"/api/config").then(function(r){return r.json();}).then(function(c){
    draftCfg=c; draftCoins=(c.coins||[]).slice();
    $("walletInput").value=c.wallet||"";
    $("daysSel").value=String(c.candleDays||7);
    $("sortSel").value=c.sort||"trades";
    renderChips(); $("searchInput").value=""; $("results").innerHTML="";
    $("modal").className="modal show";
  }).catch(function(){ showErr("Cannot load settings (server down?)"); });
}
function closeSettings(){ $("modal").className="modal"; draftCoins=null; }
function renderChips(){
  var h="";
  for(var i=0;i<draftCoins.length;i++){
    h+='<div class="chip"><span><b>'+esc(draftCoins[i].sym)+'</b> &middot; '+esc(draftCoins[i].name)+'</span>'+
       '<span class="x" data-i="'+i+'">&times;</span></div>';
  }
  if(!draftCoins.length) h='<div class="muted">No assets yet — search below to add.</div>';
  $("chips").innerHTML=h;
  var xs=$("chips").getElementsByClassName("x");
  for(var k=0;k<xs.length;k++){ xs[k].onclick=function(){ draftCoins.splice(+this.getAttribute("data-i"),1); renderChips(); }; }
}
var searchTimer=null;
function onSearch(){
  var q=$("searchInput").value.trim();
  if(searchTimer)clearTimeout(searchTimer);
  if(!q){ $("results").innerHTML=""; return; }
  searchTimer=setTimeout(function(){
    fetch(API+"/api/search?q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(list){
      list=list||[]; var h="";
      for(var i=0;i<list.length;i++){
        h+='<div class="result" data-id="'+esc(list[i].ID)+'" data-sym="'+esc((list[i].Sym||"").toUpperCase())+'" data-name="'+esc(list[i].Name)+'">'+
           '<b>'+esc((list[i].Sym||"").toUpperCase())+'</b> &middot; '+esc(list[i].Name)+'</div>';
      }
      $("results").innerHTML=h||'<div class="muted">No matches.</div>';
      var rs=$("results").getElementsByClassName("result");
      for(var k=0;k<rs.length;k++){ rs[k].onclick=function(){
        var id=this.getAttribute("data-id");
        for(var j=0;j<draftCoins.length;j++){ if(draftCoins[j].id===id) return; }
        draftCoins.push({ sym:this.getAttribute("data-sym"), name:this.getAttribute("data-name"), id:id });
        renderChips(); $("searchInput").value=""; $("results").innerHTML="";
      }; }
    }).catch(function(){ $("results").innerHTML='<div class="muted">Search failed.</div>'; });
  },350);
}
function saveSettings(){
  var body={ wallet:$("walletInput").value.trim(), candleDays:+$("daysSel").value||7, sort:$("sortSel").value||"trades", coins:draftCoins||[] };
  fetch(API+"/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(){ window.location.reload(); })
    .catch(function(){ showErr("Save failed (server down?)"); });
}
// Force a fresh copy: clear any legacy AppCache + localStorage, then reload.
function purgeAndReload(){
  try{ localStorage.clear(); }catch(e){}
  var ac=window.applicationCache; // only present on devices still holding an old cached page
  if(ac){
    try{
      ac.addEventListener("updateready",function(){ try{ac.swapCache();}catch(e){} location.reload(); },false);
      ac.addEventListener("noupdate",function(){ location.reload(); },false);
      ac.addEventListener("error",function(){ location.reload(); },false);
      ac.update();
      return;
    }catch(e){}
  }
  location.reload();
}
$("gearBtn").onclick=openSettings;
$("cancelBtn").onclick=closeSettings;
$("saveBtn").onclick=saveSettings;
$("reloadBtn").onclick=purgeAndReload;
$("searchInput").oninput=onSearch;
$("modal").onclick=function(e){ if(e.target===this) closeSettings(); };

/* ---------- pull-to-refresh (drag a column down at the top to reload) ---------- */
(function(){
  var TH=80, startY=null, pulling=false, hint=$("pullHint");
  function bind(el){
    if(!el) return;
    el.addEventListener("touchstart", function(e){
      pulling = el.scrollTop<=0;
      startY = pulling ? e.touches[0].clientY : null;
    }, false);
    el.addEventListener("touchmove", function(e){
      if(!pulling||startY==null) return;
      var dy=e.touches[0].clientY-startY;
      if(dy>0 && el.scrollTop<=0){
        if(e.cancelable) e.preventDefault();       // stop rubber-band while pulling
        var d=Math.min(dy,140);
        hint.style.height=d+"px"; hint.style.opacity=Math.min(1,d/TH);
        hint.innerHTML = d>=TH ? "&#8635; release to reload" : "&#8595; pull to reload";
      } else { pulling=false; hint.style.height="0"; hint.style.opacity=0; }
    }, {passive:false});
    el.addEventListener("touchend", function(e){
      if(pulling && startY!=null){
        var dy=e.changedTouches[0].clientY-startY;
        if(dy>=TH && el.scrollTop<=0){ hint.innerHTML="&#8635; reloading&hellip;"; window.location.reload(); return; }
      }
      hint.style.height="0"; hint.style.opacity=0; startY=null; pulling=false;
    }, false);
  }
  bind($("pmList")); bind($("cxList"));
})();

/* ---------- go ---------- */
loadState();
</script>
